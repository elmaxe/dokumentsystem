name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # The native build needs more disk than the runner leaves free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dokument/tokens build
      # The native project is generated from app.config.ts, never committed (docs/design.md §15.3, decision 37).
      - name: Generate the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      # Set up after prebuild: the Gradle files it caches by don't exist until then.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the debug APK
        working-directory: apps/mobile/android
        # One ABI (most phones) keeps the native build within the runner's memory and time.
        run: ./gradlew assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - uses: actions/upload-artifact@v4
        with:
          name: dokumentsystem-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The runner image ships a .NET 10 SDK, which global.json accepts. Installing the pinned one is best-effort, so an
      # outage of Microsoft's download servers doesn't fail CI; the next step fails if no matching SDK is there.
      - uses: actions/setup-dotnet@v5
        continue-on-error: true
        with:
          global-json-file: global.json
      - run: dotnet --version
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet build --configuration Release
      # Integration tests run against our Postgres image (Testcontainers), so build it first.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          tags: dokumentsystem-postgres:ci
          load: true
          cache-from: type=gha,scope=postgres
      # The worker reads metadata with exiftool and text in scans with Tesseract (docs/design.md §13.2).
      - name: Install exiftool and Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libimage-exiftool-perl tesseract-ocr tesseract-ocr-swe tesseract-ocr-eng fonts-dejavu-core ffmpeg
      - run: dotnet test --configuration Release --no-build
      - name: Migrations match the model
        run: dotnet ef migrations has-pending-model-changes -p src/Dokument.Infrastructure -s src/Dokument.Host --configuration Release --no-build
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: API client matches the server
        run: |
          pnpm install --frozen-lockfile --filter @dokument/api
          pnpm --filter @dokument/api generate
          git diff --exit-code -- packages/api || {
            echo "::error::packages/api is stale. Run dotnet build and pnpm --filter @dokument/api generate, then commit the result."
            exit 1
          }

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          tags: dokumentsystem-postgres:ci
          load: true
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: dokumentsystem:ci
          load: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Compose stack starts and is healthy
        run: |
          mkdir -p ci/data/originals ci/data/derived ci/data/backups
          cat > .env <<ENV
          DOKUMENT_IMAGE=dokumentsystem
          DOKUMENT_POSTGRES_IMAGE=dokumentsystem-postgres
          DOKUMENT_VERSION=ci
          PUID=$(id -u)
          PGID=$(id -g)
          ORIGINALS_LOCATION=./ci/data/originals
          DERIVED_LOCATION=./ci/data/derived
          BACKUP_LOCATION=./ci/data/backups
          DB_DATA_LOCATION=./ci/postgres
          DB_PASSWORD=ci-password
          ENV
          docker compose up -d --wait --wait-timeout 180
          curl --fail --silent http://localhost:8080/api/v1/server/info
          curl --fail --silent http://localhost:8080/ | grep -q '<div id="root">'
      - if: failure()
        run: docker compose logs
