name: Publish images

# Pushes multi-arch images to GHCR: "edge" from the default branch, and version tags from v* tags.
on:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  publish:
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: dokumentsystem
            context: .
            platforms: linux/amd64,linux/arm64
          - name: dokumentsystem-links
            context: .
            file: docker/links/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: dokumentsystem-postgres
            context: docker/postgres
            platforms: linux/amd64,linux/arm64
          - name: dokumentsystem-ml
            context: ml
            platforms: linux/amd64,linux/arm64
            variant: cpu
          # NVIDIA GPUs (docs/design.md §11): the same image with cuBLAS and cuDNN, tagged with a -cuda suffix.
          - name: dokumentsystem-ml
            context: ml
            platforms: linux/amd64
            variant: cuda
            suffix: -cuda
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: suffix=${{ matrix.suffix || '' }},onlatest=true
          tags: |
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-edge.{0}', github.run_number) }}
            VARIANT=${{ matrix.variant || 'cpu' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}${{ matrix.suffix }}
